name: CI

on:
  push:
    # Run on all branches and not for tags
    branches:
      - '**'
  pull_request:

jobs:
  find_typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find typos
        uses: crate-ci/typos@v1.40.0

  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Main modules use 17, examples use 25
          java-version: |
            17
            25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew assemble
      - name: Test
        # Swing tests need Xvfb in a headless environment here
        run: xvfb-run --auto-servernum ./gradlew test
