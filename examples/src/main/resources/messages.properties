MyApp.clickMessage=.input {$click_count :number} \
.match $click_count \
0 {{{$name} did not click this button!}} \
1 {{{$name} clicked this button one time!}} \
* {{{$name} clicked this button {$click_count} times!}}
MyApp.prompt=Enter a name
