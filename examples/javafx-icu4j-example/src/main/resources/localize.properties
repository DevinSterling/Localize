# Setting the ICU4J formatter to MF2:
localize.icu4j.formatter = com.ibm.icu.message2.MessageFormatter

# MF1 is the default formatter, so specifying it here is optional, as well as this file:
# Note: MF1 and MF2 syntax are incompatible.
#
# localize.icu4j.formatter = com.ibm.icu.text.MessageFormat

# The ICU4J formatter can also be set as a JVM system property:
# -Dlocalize.icu4j.formatter=com.ibm.icu.message2.MessageFormatter
