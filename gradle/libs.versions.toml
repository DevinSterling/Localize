# Shared plugins/dependencies between projects

[versions]
module-plugin-dep = '2.1.0'
javafx-plugin-dep = '0.1.0'
jreleaser-plugin-dep = '1.27.0'
javafx-dep = '17.0.21'
junit-dep = '6.1.3'
equalsverifier-dep = '4.5.2'
icu4j-dep = '79.1'

[plugins]
javamodularity = { id = 'org.javamodularity.moduleplugin', version.ref = 'module-plugin-dep' }
javafx-plugin = { id = 'org.openjfx.javafxplugin', version.ref = 'javafx-plugin-dep' }
jreleaser = { id = 'org.jreleaser', version.ref = 'jreleaser-plugin-dep' }

[libraries]
junit-jupiter = { module = 'org.junit.jupiter:junit-jupiter', version.ref = 'junit-dep' }
junit-launcher = { module = 'org.junit.platform:junit-platform-launcher', version.ref = 'junit-dep' }
equalsverifier = { module = 'nl.jqno.equalsverifier:equalsverifier', version.ref = 'equalsverifier-dep' }
icu4j = { module = 'com.ibm.icu:icu4j', version.ref = 'icu4j-dep' }
